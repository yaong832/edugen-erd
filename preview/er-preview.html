<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduGen ER 미리보기</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem 1.5rem 3rem; background: #f6f8fa; }
    h1 { font-size: 1.25rem; margin-top: 2rem; }
    h1:first-of-type { margin-top: 0; }
    .box { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; overflow: auto; }
    .err { color: #cf222e; white-space: pre-wrap; }
    p.note { color: #57606a; font-size: 0.9rem; }
  </style>
</head>
<body>
  <p class="note">로컬 파일입니다. 인터넷이 있어야 Mermaid CDN을 불러옵니다. 브라우저에서 이 파일을 열면 됩니다.</p>
  <h1>전체 ER (상세)</h1>
  <div class="box" id="full"></div>
  <h1>발표용 ER (축약)</h1>
  <div class="box" id="summary"></div>
  <script>
    (async function () {
      mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });
      const full = "erDiagram\n    USERS {\n        uuid id PK\n        varchar email UK\n        varchar password_hash\n        varchar name\n        varchar provider\n        varchar role\n        int token_balance\n        varchar status\n        int login_fail_count\n        timestamp locked_until\n        timestamp withdrawn_at\n        timestamp updated_at\n    }\n\n    USER_PROFILES {\n        uuid user_id PK,FK\n        varchar role_type\n        varchar preferred_level\n        varchar purpose\n        boolean onboarding_completed\n        int onboarding_step\n        timestamp created_at\n        timestamp updated_at\n    }\n\n    REFRESH_TOKENS {\n        bigserial id PK\n        uuid user_id FK\n        varchar token\n        varchar device_info\n        varchar ip_address\n        timestamp expire_at\n        timestamp created_at\n    }\n\n    EMAIL_VERIFICATIONS {\n        bigserial id PK\n        uuid user_id FK\n        varchar token\n        boolean used\n        timestamp expires_at\n        timestamp created_at\n    }\n\n    PROJECTS {\n        uuid id PK\n        uuid owner_user_id FK\n        varchar project_type\n        uuid educator_project_id\n        uuid learner_project_id\n        varchar title\n        varchar topic\n        text description\n        varchar target_level\n        jsonb model_settings\n        text tags\n        boolean is_favorite\n        varchar status\n        timestamp created_at\n        timestamp updated_at\n    }\n\n    OUTLINES {\n        uuid id PK\n        uuid project_id FK\n        jsonb tree_structure\n        int version\n        varchar status\n        timestamp confirmed_at\n        timestamp created_at\n        timestamp updated_at\n    }\n\n    OUTLINE_VERSIONS {\n        bigserial id PK\n        uuid outline_id FK\n        int version\n        jsonb snapshot\n        uuid updated_by\n        timestamp created_at\n    }\n\n    CHAT_MESSAGES {\n        bigserial id PK\n        uuid project_id FK\n        varchar sender_type\n        text message\n        jsonb context_meta\n        timestamp created_at\n    }\n\n    REFERENCES {\n        uuid id PK\n        uuid project_id FK\n        varchar source_type\n        varchar file_url\n        text extracted_text\n        varchar vector_status\n        timestamp created_at\n    }\n\n    TEMPLATES {\n        uuid id PK\n        uuid owner_user_id FK\n        varchar name\n        jsonb outline_template\n        boolean is_public\n        timestamp created_at\n    }\n\n    SHARED_LINKS {\n        uuid id PK\n        uuid project_id FK\n        varchar token\n        timestamp expires_at\n        int view_count\n        boolean is_active\n        timestamp created_at\n    }\n\n    CONTENTS {\n        uuid id PK\n        uuid project_id FK\n        uuid created_by FK\n        varchar project_type\n        varchar type\n        varchar title\n        text body_markdown\n        varchar file_url\n        int token_used\n        jsonb meta\n        varchar status\n        timestamp created_at\n        timestamp updated_at\n    }\n\n    QUIZ_QUESTIONS {\n        uuid id PK\n        uuid content_id FK\n        text question\n        varchar question_type\n        jsonb choices\n        text answer\n        text explanation\n        int order_no\n    }\n\n    QUESTION_VERSIONS {\n        bigserial id PK\n        uuid question_id FK\n        int version\n        jsonb snapshot\n        uuid updated_by\n        timestamp created_at\n    }\n\n    FLASHCARDS {\n        uuid id PK\n        uuid content_id FK\n        text front\n        text back\n        varchar difficulty\n        int order_no\n    }\n\n    CARD_REVIEWS {\n        bigserial id PK\n        uuid flashcard_id FK\n        uuid user_id FK\n        int quality_score\n        int interval_days\n        int repetition\n        float easiness_factor\n        timestamp reviewed_at\n    }\n\n    ILLUSTRATIONS {\n        uuid id PK\n        uuid content_id FK\n        varchar prompt\n        varchar image_url\n        varchar model_name\n        varchar status\n        timestamp created_at\n    }\n\n    NARRATIONS {\n        uuid id PK\n        uuid content_id FK\n        varchar voice\n        varchar audio_url\n        int duration_sec\n        varchar status\n        timestamp created_at\n    }\n\n    AUDIO_FILES {\n        uuid id PK\n        uuid project_id FK\n        uuid uploaded_by FK\n        varchar file_url\n        varchar stt_status\n        text transcript\n        timestamp created_at\n    }\n\n    SELF_ASSESSMENTS {\n        uuid id PK\n        uuid content_id FK\n        uuid user_id FK\n        int score\n        text feedback\n        timestamp submitted_at\n    }\n\n    TOKEN_TRANSACTIONS {\n        bigserial id PK\n        uuid user_id FK\n        int amount\n        varchar tx_type\n        varchar reason\n        bigint ref_id\n        timestamp created_at\n    }\n\n    JOBS {\n        uuid id PK\n        uuid content_id FK\n        uuid requested_by FK\n        varchar queue_name\n        varchar status\n        int retry_count\n        text error_message\n        timestamp created_at\n        timestamp updated_at\n    }\n\n    %% 관계\n    USERS ||--|| USER_PROFILES : has\n    USERS ||--o{ REFRESH_TOKENS : owns\n    USERS ||--o{ EMAIL_VERIFICATIONS : verifies\n    USERS ||--o{ PROJECTS : owns\n    USERS ||--o{ CONTENTS : creates\n    USERS ||--o{ TOKEN_TRANSACTIONS : has\n    USERS ||--o{ CARD_REVIEWS : reviews\n    USERS ||--o{ AUDIO_FILES : uploads\n    USERS ||--o{ TEMPLATES : owns\n    USERS ||--o{ JOBS : requests\n\n    PROJECTS ||--|| OUTLINES : has_current\n    OUTLINES ||--o{ OUTLINE_VERSIONS : versioned_as\n    PROJECTS ||--o{ CHAT_MESSAGES : contains\n    PROJECTS ||--o{ REFERENCES : contains\n    PROJECTS ||--o{ SHARED_LINKS : shared_by\n    PROJECTS ||--o{ CONTENTS : generates\n    PROJECTS ||--o{ AUDIO_FILES : contains\n\n    CONTENTS ||--o{ QUIZ_QUESTIONS : includes\n    QUIZ_QUESTIONS ||--o{ QUESTION_VERSIONS : versioned_as\n    CONTENTS ||--o{ FLASHCARDS : includes\n    FLASHCARDS ||--o{ CARD_REVIEWS : reviewed_by\n    CONTENTS ||--o{ ILLUSTRATIONS : includes\n    CONTENTS ||--o{ NARRATIONS : includes\n    CONTENTS ||--o{ SELF_ASSESSMENTS : assessed_by\n    CONTENTS ||--o{ JOBS : processed_by";
      const summary = "erDiagram\n    USERS {\n        uuid id PK\n        varchar email UK\n        varchar role\n        varchar status\n        int token_balance\n    }\n\n    USER_PROFILES {\n        uuid user_id PK,FK\n        varchar role_type\n        boolean onboarding_completed\n    }\n\n    REFRESH_TOKENS {\n        bigserial id PK\n        uuid user_id FK\n        timestamp expire_at\n    }\n\n    EMAIL_VERIFICATIONS {\n        bigserial id PK\n        uuid user_id FK\n        boolean used\n    }\n\n    PROJECTS {\n        uuid id PK\n        uuid owner_user_id FK\n        varchar project_type\n        uuid educator_project_id\n        uuid learner_project_id\n        varchar title\n        varchar status\n    }\n\n    OUTLINES {\n        uuid id PK\n        uuid project_id FK\n        int version\n        varchar status\n    }\n\n    OUTLINE_VERSIONS {\n        bigserial id PK\n        uuid outline_id FK\n        int version\n    }\n\n    CHAT_MESSAGES {\n        bigserial id PK\n        uuid project_id FK\n        varchar sender_type\n    }\n\n    REFERENCES {\n        uuid id PK\n        uuid project_id FK\n        varchar vector_status\n    }\n\n    TEMPLATES {\n        uuid id PK\n        uuid owner_user_id FK\n        boolean is_public\n    }\n\n    SHARED_LINKS {\n        uuid id PK\n        uuid project_id FK\n        boolean is_active\n    }\n\n    CONTENTS {\n        uuid id PK\n        uuid project_id FK\n        uuid created_by FK\n        varchar type\n        varchar status\n    }\n\n    QUIZ_QUESTIONS {\n        uuid id PK\n        uuid content_id FK\n        varchar question_type\n        int order_no\n    }\n\n    QUESTION_VERSIONS {\n        bigserial id PK\n        uuid question_id FK\n        int version\n    }\n\n    FLASHCARDS {\n        uuid id PK\n        uuid content_id FK\n        int order_no\n    }\n\n    CARD_REVIEWS {\n        bigserial id PK\n        uuid flashcard_id FK\n        uuid user_id FK\n    }\n\n    ILLUSTRATIONS {\n        uuid id PK\n        uuid content_id FK\n        varchar status\n    }\n\n    NARRATIONS {\n        uuid id PK\n        uuid content_id FK\n        varchar status\n    }\n\n    AUDIO_FILES {\n        uuid id PK\n        uuid project_id FK\n        uuid uploaded_by FK\n        varchar stt_status\n    }\n\n    SELF_ASSESSMENTS {\n        uuid id PK\n        uuid content_id FK\n        uuid user_id FK\n        int score\n    }\n\n    TOKEN_TRANSACTIONS {\n        bigserial id PK\n        uuid user_id FK\n        int amount\n        varchar tx_type\n    }\n\n    JOBS {\n        uuid id PK\n        uuid content_id FK\n        uuid requested_by FK\n        varchar status\n    }\n\n    USERS ||--|| USER_PROFILES : has\n    USERS ||--o{ REFRESH_TOKENS : owns\n    USERS ||--o{ EMAIL_VERIFICATIONS : verifies\n    USERS ||--o{ PROJECTS : owns\n    USERS ||--o{ CONTENTS : creates\n    USERS ||--o{ TOKEN_TRANSACTIONS : has\n    USERS ||--o{ CARD_REVIEWS : reviews\n    USERS ||--o{ AUDIO_FILES : uploads\n    USERS ||--o{ TEMPLATES : owns\n    USERS ||--o{ JOBS : requests\n\n    PROJECTS ||--|| OUTLINES : has_current\n    OUTLINES ||--o{ OUTLINE_VERSIONS : versioned_as\n    PROJECTS ||--o{ CHAT_MESSAGES : contains\n    PROJECTS ||--o{ REFERENCES : contains\n    PROJECTS ||--o{ SHARED_LINKS : shared_by\n    PROJECTS ||--o{ CONTENTS : generates\n    PROJECTS ||--o{ AUDIO_FILES : contains\n\n    CONTENTS ||--o{ QUIZ_QUESTIONS : includes\n    QUIZ_QUESTIONS ||--o{ QUESTION_VERSIONS : versioned_as\n    CONTENTS ||--o{ FLASHCARDS : includes\n    FLASHCARDS ||--o{ CARD_REVIEWS : reviewed_by\n    CONTENTS ||--o{ ILLUSTRATIONS : includes\n    CONTENTS ||--o{ NARRATIONS : includes\n    CONTENTS ||--o{ SELF_ASSESSMENTS : assessed_by\n    CONTENTS ||--o{ JOBS : processed_by";
      async function render(id, source, mount) {
        const el = document.getElementById(mount);
        try {
          const { svg } = await mermaid.render(id + "-" + Math.random().toString(36).slice(2), source);
          el.innerHTML = svg;
        } catch (e) {
          el.innerHTML = '<div class="err">' + (e && e.message ? e.message : String(e)) + '</div>';
        }
      }
      await render("full", full, "full");
      await render("sum", summary, "summary");
    })();
  </script>
</body>
</html>
